<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1026" />
    <meta name="description" content="Agenda del Gimnasio Emocional Mentes Brillantes: sesiones, reuniones y recordatorios, en web, Android e iPhone." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda MB" />
    <!-- Abrir la conexión con Firebase desde el primer instante (ahorra ~100-300ms por host en celular) -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
    <title>Agenda Mentes Brillantes</title>
    <script>
      // Aplica el tema guardado ANTES de pintar, para que el splash y la app
      // salgan del color correcto (sin destello oscuro en el tema claro).
      // Mismas claves que src/hooks/ThemeProvider.tsx.
      try {
        var t = localStorage.getItem("theme");
        var d = document.documentElement;
        var base = "dark";
        if (t === "pink") base = "light";
        if (t === "custom") {
          var p = JSON.parse(localStorage.getItem("temaPersonal") || "{}");
          base = p && p.base === "light" ? "light" : "dark";
        }
        d.dataset.theme = t === "pink" || t === "custom" ? t : "dark";
        d.dataset.base = base;
        if (base === "dark") d.classList.add("dark");
      } catch (e) {}
    </script>
    <style>
      /* Splash instantáneo mientras carga el código (React lo reemplaza al montar). */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(120% 78% at 50% -12%, rgba(215, 180, 106, 0.2), transparent 55%),
          linear-gradient(160deg, #0a1026 0%, #111a3d 100%);
      }
      html[data-base="light"] #boot-splash {
        background:
          radial-gradient(120% 78% at 50% -12%, rgba(247, 168, 196, 0.42), transparent 55%),
          linear-gradient(160deg, #fff9fb 0%, #fde9f0 100%);
      }
      #boot-splash img {
        width: 84px;
        height: 84px;
        border-radius: 22px;
        box-shadow: 0 14px 40px rgba(0, 0, 0, 0.35);
      }
      #boot-splash .ring {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 3px solid rgba(215, 180, 106, 0.25);
        border-top-color: #d7b46a;
        animation: bootspin 0.9s linear infinite;
      }
      html[data-base="light"] #boot-splash .ring {
        border-color: rgba(194, 65, 110, 0.2);
        border-top-color: #c2416e;
      }
      @keyframes bootspin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-splash">
        <img src="/icons/icon-192.png" alt="Agenda Mentes Brillantes" />
        <div class="ring"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
